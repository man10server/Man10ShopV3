services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      man10socket-mock:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./config:/man10shopv3/config:ro
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  man10socket-mock:
    image: busybox:1.36
    command: ["sh", "-c", "nc -lk -p 3000 >/dev/null"]
    restart: unless-stopped

volumes:
  mongodb_data:
