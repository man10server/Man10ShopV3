version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: man10shopv3
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config/config.json:/man10shopv3/config/config.json:ro
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: man10shopv3-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet mongodb://localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodb_data:
